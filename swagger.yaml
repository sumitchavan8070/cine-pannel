openapi: 3.0.0
info:
  title: CineMarathi API
  version: 1.0.0
  description: API documentation for CineMarathi - Marathi film industry platform

servers:
  - url: http://localhost:3001/api
    description: Local development
  - url: https://api.cine.fluttertales.tech/api
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token. Use Bearer <token> in Authorization header

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

tags:
  - name: Admin Auth
    description: Admin authentication
  - name: Admin
    description: Admin panel management
  - name: Admin Analytics
    description: Analytics and statistics
  - name: Admin Banners
    description: App banner management
  - name: Auth
    description: User authentication
  - name: Subscriptions
    description: Premium subscriptions
  - name: Casting
    description: Casting calls
  - name: Roles
    description: User roles

paths:
  /admin-auth/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token: { type: string }
                  user: { type: object }
        401:
          description: Invalid credentials

  /admin-auth/verify:
    post:
      tags: [Admin Auth]
      summary: Verify admin token
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Token valid
        401:
          description: Invalid token

  /admin-auth/logout:
    post:
      tags: [Admin Auth]
      summary: Admin logout
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Logged out

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Get dashboard stats
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Dashboard statistics

  /admin/users:
    get:
      tags: [Admin]
      summary: List all users
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_type
          in: query
          schema: { type: string }
      responses:
        200:
          description: List of users

  /admin/users/{id}/verify:
    put:
      tags: [Admin]
      summary: Verify user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_verified: { type: boolean }
      responses:
        200:
          description: Updated

  /admin/users/{id}/assign-premium:
    post:
      tags: [Admin]
      summary: Assign premium to user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: integer, nullable: true }
      responses:
        200:
          description: Premium assigned

  /admin/users/{id}/remove-premium:
    delete:
      tags: [Admin]
      summary: Remove premium from user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Premium removed

  /admin/premium-users:
    get:
      tags: [Admin]
      summary: List premium users
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: List of premium users

  /admin/subscriptions:
    get:
      tags: [Admin]
      summary: List all subscriptions
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: List of subscriptions
    post:
      tags: [Admin]
      summary: Create subscription
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [user_id, plan_id, start_date, end_date]
              properties:
                user_id: { type: integer }
                plan_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                is_active: { type: boolean }
      responses:
        201:
          description: Created

  /admin/subscriptions/{id}:
    put:
      tags: [Admin]
      summary: Update subscription
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Updated
    delete:
      tags: [Admin]
      summary: Delete subscription
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Deleted

  /admin/casting-calls:
    get:
      tags: [Admin]
      summary: List casting calls
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: List of casting calls

  /admin/analytics/overview:
    get:
      tags: [Admin Analytics]
      summary: Get analytics overview
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Analytics overview

  /admin/analytics/stats:
    get:
      tags: [Admin Analytics]
      summary: Get stats
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Statistics

  /admin/banners:
    get:
      tags: [Admin Banners]
      summary: List banners
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: List of banners
    post:
      tags: [Admin Banners]
      summary: Upload banner
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        201:
          description: Banner uploaded

  /admin/banners/{filename}:
    put:
      tags: [Admin Banners]
      summary: Update banner
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Updated
    delete:
      tags: [Admin Banners]
      summary: Delete banner
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Deleted

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                user_type: { type: string }
      responses:
        201:
          description: Registered

  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Login successful

  /subscriptions/plans:
    get:
      tags: [Subscriptions]
      summary: Get premium plans
      responses:
        200:
          description: List of plans

  /subscriptions/status:
    get:
      tags: [Subscriptions]
      summary: Get user subscription status
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Subscription status

  /subscriptions/subscribe:
    post:
      tags: [Subscriptions]
      summary: Subscribe to plan
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: integer }
      responses:
        200:
          description: Subscribed

  /roles:
    get:
      tags: [Roles]
      summary: List roles
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: List of roles

  /casting/calls:
    get:
      tags: [Casting]
      summary: List casting calls
      responses:
        200:
          description: List of casting calls
    post:
      tags: [Casting]
      summary: Create casting call
      security: [{ bearerAuth: [] }]
      responses:
        201:
          description: Created
